<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0070f2"/>
      <stop offset="100%" stop-color="#053075"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ef4444" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo com cantos arredondados -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <!-- Brilho sutil interno -->
  <rect x="12" y="12" width="488" height="488" rx="103" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>

  <!-- Caixa / Pallet Isométrico -->
  <g transform="translate(256, 260)">
    <!-- Top Face -->
    <polygon points="0,-110 130,-45 0,20 -130,-45" fill="url(#boxGrad)"/>
    <!-- Left Face -->
    <polygon points="-130,-45 0,20 0,140 -130,75" fill="#94a3b8"/>
    <!-- Right Face -->
    <polygon points="0,20 130,-45 130,75 0,140" fill="#64748b"/>

    <!-- Fita Adesiva / Selo SAP -->
    <polygon points="-30,-95 30,-65 0,-50 -60,-80" fill="#0070f2" opacity="0.9"/>

    <!-- Linhas de Código de Barras no lado direito -->
    <g transform="translate(35, 10) skewY(-26)" fill="#ffffff" opacity="0.9">
      <rect x="0" y="0" width="5" height="55"/>
      <rect x="9" y="0" width="10" height="55"/>
      <rect x="23" y="0" width="4" height="55"/>
      <rect x="31" y="0" width="12" height="55"/>
      <rect x="47" y="0" width="6" height="55"/>
      <rect x="57" y="0" width="10" height="55"/>
    </g>

    <!-- Linha Laser Vermelha Ativa -->
    <line x1="-160" y1="2" x2="160" y2="2" stroke="#f87171" stroke-width="6" filter="url(#glow)"/>
    <line x1="-160" y1="2" x2="160" y2="2" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Badge SAP no Topo -->
  <rect x="176" y="58" width="160" height="46" rx="10" fill="rgba(0,0,0,0.35)" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <text x="256" y="90" font-family="'Inter', sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">SAP BTP</text>

  <!-- Texto RF na base -->
  <text x="256" y="465" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="4">ESTOQUE RF</text>
</svg>
